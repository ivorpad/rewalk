name: typecheck
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewalk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - run: npm run typecheck
